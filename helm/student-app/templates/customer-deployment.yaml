apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
  labels:
    app: customer-api
    tier: backend
    {{- include "student-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.customerApi.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: customer-api
      {{- include "student-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: customer-api
        tier: backend
        {{- include "student-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: customer-api
          image: {{ include "student-app.customerApiImage" . }}
          imagePullPolicy: {{ .Values.customerApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.customerApi.service.targetPort }}
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.customerApi.env.springProfilesActive | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.customerApi.env.springDatasourceUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.customerApi.env.springDatasourceUsername | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: customer-api-config
          resources:
            {{- toYaml .Values.customerApi.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.customerApi.readinessProbe.path }}
              port: {{ .Values.customerApi.service.targetPort }}
            initialDelaySeconds: {{ .Values.customerApi.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.customerApi.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.customerApi.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.customerApi.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.customerApi.livenessProbe.path }}
              port: {{ .Values.customerApi.service.targetPort }}
            initialDelaySeconds: {{ .Values.customerApi.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.customerApi.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.customerApi.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.customerApi.livenessProbe.failureThreshold }}
