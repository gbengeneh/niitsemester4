global:
  imageRegistry: docker.io/gbenga12
  imageTag: latest

apiGateway:
  replicaCount: 1
  image:
    repository: api-gateway
    pullPolicy: Always
  service:
    type: NodePort
    port: 80
    targetPort: 8085
    nodePort: 30007
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: student-app.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ""

customerApi:
  replicaCount: 3
  image:
    repository: customer-api
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 7074
    targetPort: 7074
  env:
    springProfilesActive: k8s
    springDatasourceUrl: jdbc:postgresql://postgres:5432/niitdevcustomerdb
    springDatasourceUsername: postgres
  config:
    springApplicationName: customer-api
    serverPort: "7074"
    springJpaHibernateDdlAuto: update
    springJpaShowSql: "false"
    managementEndpointsExposureInclude: health,info
    managementEndpointHealthShowDetails: never
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m
  readinessProbe:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

postgres:
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  auth:
    database: niitdevcustomerdb
    username: postgres
    password: "123"
  persistence:
    size: 1Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
